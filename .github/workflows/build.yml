# Compila Bottega dei Modi per Windows, Mac e Linux, esegue le prove e pubblica i plugin come artefatti scaricabili.
name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest,   name: Mac }
          - { os: ubuntu-22.04,   name: Linux }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev ninja-build

      - name: Cache di JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.10-${{ runner.os }}

      - name: Configura
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          elif [ "$RUNNER_OS" == "Linux" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build
          fi

      - name: Compila
        run: cmake --build build --config Release --parallel 4

      - name: Prove del nucleo
        shell: bash
        run: |
          exe=build/BottegaTests_artefacts/Release/BottegaTests
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe"

      - name: Prova del plugin (suono, MIDI, interfaccia)
        shell: bash
        run: |
          exe=build/BottegaSmoke_artefacts/Release/BottegaSmoke
          [ -f "$exe.exe" ] && exe="$exe.exe"
          mkdir -p schermate
          "$exe" schermate

      - name: Controlla la versione minima di macOS (11)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for f in "build/Bottega_artefacts/Release/Standalone/Bottega dei Modi.app/Contents/MacOS/Bottega dei Modi" \
                   "build/Bottega_artefacts/Release/VST3/Bottega dei Modi.vst3/Contents/MacOS/Bottega dei Modi" \
                   "build/Bottega_artefacts/Release/AU/Bottega dei Modi.component/Contents/MacOS/Bottega dei Modi"; do
            echo "$f"
            vtool -show-build "$f" | grep -E "architecture|minos"
            if vtool -show-build "$f" | awk '/minos/ {split($2,v,"."); if (v[1] > 11) bad=1} END {exit !bad}'; then
              echo "Compilato per una versione di macOS più recente di 11"; exit 1
            fi
          done

      - name: Prepara il pacchetto
        shell: bash
        run: |
          mkdir -p pacchetto
          cp -R "build/Bottega_artefacts/Release/VST3/Bottega dei Modi.vst3" pacchetto/
          if [ "$RUNNER_OS" == "macOS" ]; then
            cp -R "build/Bottega_artefacts/Release/AU/Bottega dei Modi.component" pacchetto/
            cp -R "build/Bottega_artefacts/Release/Standalone/Bottega dei Modi.app" pacchetto/
          elif [ "$RUNNER_OS" == "Windows" ]; then
            cp "build/Bottega_artefacts/Release/Standalone/Bottega dei Modi.exe" pacchetto/
          else
            cp "build/Bottega_artefacts/Release/Standalone/Bottega dei Modi" pacchetto/
          fi
          cp README.md pacchetto/LEGGIMI.md

      - uses: actions/upload-artifact@v4
        with:
          name: Bottega-dei-Modi-${{ matrix.name }}
          path: pacchetto

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Schermate-${{ matrix.name }}
          path: schermate
          if-no-files-found: ignore
